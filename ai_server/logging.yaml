# root/logging.yaml

version: 1
disable_existing_loggers: false

formatters:
  default:
    format: "[%(levelname)s] %(asctime)s - %(name)s - %(message)s"

  access:
    format: '[%(levelname)s] %(asctime)s - %(client_addr)s - "%(request_line)s" %(status_code)s'

handlers:
  console:
    class: logging.StreamHandler
    formatter: default
    stream: ext://sys.stdout

  access_console:
    class: logging.StreamHandler
    formatter: access
    stream: ext://sys.stdout

loggers:
  uvicorn:
    level: INFO
    handlers: [console]
    propagate: false

  uvicorn.error:
    level: INFO
    handlers: [console]
    propagate: false

  uvicorn.access:
    level: INFO
    handlers: [access_console]
    propagate: false

  app:
    level: INFO
    handlers: [console]
    propagate: false

root:
  level: INFO
  handlers: [console]